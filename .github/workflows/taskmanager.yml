name: Task Manager CI
on:
  push:
    paths:
      - 'taskmanager/**'
      - '.github/workflows/taskmanager.yml'
  pull_request:
    paths:
      - 'taskmanager/**'
      - '.github/workflows/taskmanager.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskmanager
    strategy:
      matrix:
        database: [h2, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskmanager_test
          POSTGRES_USER: taskmanager
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskmanager -d taskmanager_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: taskmanager/pom.xml
      - run: chmod +x mvnw
      - name: Verify with H2
        if: matrix.database == 'h2'
        run: ./mvnw -B verify
      - name: Verify with PostgreSQL
        if: matrix.database == 'postgres'
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/taskmanager_test
          TEST_DB_USERNAME: taskmanager
          TEST_DB_PASSWORD: test-password
        run: ./mvnw -B verify
